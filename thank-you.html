<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Mindful Healing</title>
    <!-- Include Nunito Sans font from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Base Resets & Typography */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Nunito Sans', sans-serif;
            background-color: #F6EFE0; /* Warm, welcoming background */
            color: #080808; /* Dark, readable text */
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* Container Styling */
        .container {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            max-width: 500px;
            width: 90%;
            text-align: center;
            /* You can add a top border using another brand color if you have one,
               otherwise, this keeps it clean */
        }

        /* Typography */
        h1 {
            color: #080808;
            margin-bottom: 16px;
            font-size: 24px;
            font-weight: 700;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 24px;
            font-weight: 400;
        }

        /* Return Button */
        .btn {
            display: inline-block;
            background-color: #080808; /* Using the dark text color for high contrast */
            color: #F6EFE0; /* Using the light background color for text */
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 4px;
            font-weight: 600;
            transition: opacity 0.2s ease;
        }

        .btn:hover {
            opacity: 0.8; /* Simple hover effect */
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Optional: Insert an <img> tag here for the logo if you have it -->
        <h1>Thank You for Reaching Out</h1>
        <p>We have successfully received your information. A member of the Mindful Healing team will review your details and contact you shortly.</p>

        <!-- You can update this href to point back to their actual website once known -->
        <a href="#" class="btn">Return to Homepage</a>
    </div>

</body>
</html>
