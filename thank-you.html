<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Mindful Healing</title>
    <style>
        /* Base Resets & Typography */
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f7faf9; /* Soft, calming off-white */
            color: #334155; /* Slate gray for readable text */
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* Container Styling */
        .container {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            max-width: 500px;
            width: 90%;
            text-align: center;
            border-top: 5px solid #4ade80; /* Mindful green accent */
        }

        /* Typography */
        h1 {
            color: #0f172a;
            margin-bottom: 16px;
            font-size: 24px;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        /* Return Button */
        .btn {
            display: inline-block;
            background-color: #4ade80;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 4px;
            font-weight: 600;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: #22c55e;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Thank You for Reaching Out</h1>
        <p>We have successfully received your information. A member of the Mindful Healing team will review your details and contact you shortly.</p>

        <a href="#" class="btn">Return to Homepage</a>
    </div>

</body>
</html>
